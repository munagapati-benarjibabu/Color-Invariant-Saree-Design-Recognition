services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: saree_db
      MYSQL_USER: saree
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-password}
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    env_file: .env
    ports: ["8080:8080"]
    depends_on:
      mysql: {condition: service_healthy}
    volumes: ["./saree-images:/app/saree-images"]
volumes: {mysql-data: {}}
