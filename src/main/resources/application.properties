server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/saree_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

saree.match.threshold=${SAREE_MATCH_THRESHOLD:35}
saree.upload.max-bytes=10485760
saree.image.directory=./saree-images
saree.admin.token=${SAREE_ADMIN_TOKEN:change-this-before-deploying}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
