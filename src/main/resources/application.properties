server.port=8080

# Replace YOUR_PASSWORD with the password configured for your local MySQL root user.
spring.datasource.url=jdbc:mysql://localhost:3306/saree_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=YOUR_PASSWORD
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

saree.match.threshold=70
saree.upload.max-bytes=10485760
saree.image.directory=./saree-images
